name: Validate catalog

# Validates plugins.json (the trust root the Phlix server reads) on pushes to
# master and on pull requests:
#   1. JSON-Schema conformance against plugins.schema.json (pinned validator).
#   2. plugins.json is valid JSON AND entries are in canonical order (name
#      ascending, dev-channel entries — version "dev" — last within a name, version
#      tie-break) with no duplicate (name, version) pairs, plus the schema-shape
#      mirror — all via the single-source scripts/catalog-gate.jq, which the
#      catalog updater also runs pre-push (same gate on both paths). The dev
#      channel reuses a plugin's name, so uniqueness is keyed on (name, version),
#      not the bare name (the "canonical order/dedup" code-quality gate).
#   3. (non-blocking on PRs, blocking on push) per-entry pin-drift check: download
#      each pinned tarball and assert its sha256 matches artifactSha256.
#   4. (BLOCKING) per-entry plugin-manifest check: download each pinned tarball,
#      extract its `plugin.json`, and validate it against the phlix-shared
#      manifest schema — the SAME contract the Phlix server enforces at install
#      time, fetched at a PINNED tag and digest-verified (never floating master).
#      This is the guardrail that stops a catalog release from pinning a
#      plugin the server would reject on install: an invalid `type` (must be a
#      value from the manifest schema's enum — e.g. `metadata-provider`, NOT
#      `metadata`), a `settings.<name>` field carrying a key the strict settings
#      schema forbids (e.g. an inert `managed` flag), a malformed `events[]`
#      entry, etc. If any pinned manifest is invalid, CI fails.
#
# Trust-model containment (review phlix-plugins__seceng M-06):
#   - Push triggers are scoped to master: a branch push elsewhere (or in a fork's
#     remote refs visible here) does not burn the full validation fleet.
#   - The pytest job executes REPO Python. On a fork PR, the merge ref is
#     PR-authored code, so arbitrary attacker Python would run on our runners
#     with the catalog checkout. pytest therefore runs on pushes and on SAME-REPO
#     PRs only. Fork PRs still get the pure-data gates (schema job: ajv/jq
#     validating PR bytes; pin-drift/manifest fetch pinned tarballs) — those read
#     data, they do not execute it.
#   - The data-driven jobs (pin-drift, manifest) take `needs: schema`, so a
#     malformed or hostile-shape catalog is rejected BEFORE any workflow trusts
#     jq-extracted URLs/refs from it.
#
# Landmines honored:
#   - The schema uses `format: uri`, so ajv needs ajv-formats (co-installed and
#     passed via `-c ajv-formats`), otherwise the `uri` format keyword errors.
#   - The schema is Draft 2020-12, so ajv needs `--spec=draft2020`.
#   - NO setup-node `cache: npm` — this repo has no lockfile.
#
# Toolchain law (review phlix-plugins__seceng M-07): every `uses:` action is
# pinned to a full commit SHA (release tag in the trailing comment), the ajv
# validator runs at EXACT npm versions, and the pytest job installs from the
# hash-locked requirements-test.txt with --require-hashes. Bumps are deliberate,
# diff-visible edits — never silent resolution drift. TestWorkflowContract in
# tests/test_catalog.py reddens if any of this regresses.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    name: JSON-Schema + sort/dedup
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # review seceng M-PHLIX-PLUGINS-09: bounded wall clock on every job
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '24'
          # No `cache: npm` — there is no lockfile in this repo (known landmine).

      - name: Validate plugins.json against plugins.schema.json
        run: |
          # ajv-cli 5.0.0 (ajv v8) for Draft 2020-12; ajv-formats 2.1.1 supplies
          # the `uri` format keyword the schema relies on. EXACT versions — npx
          # major-ranges (@5/@2) re-resolve to whatever upstream ships next
          # (review phlix-plugins__seceng M-07).
          npx --yes --package ajv-cli@5.0.0 --package ajv-formats@2.1.1 -- \
            ajv validate \
              --spec=draft2020 \
              -s plugins.schema.json \
              -d plugins.json \
              -c ajv-formats

      - name: Assert plugins.json is valid JSON, canonical order/dedup, schema-shape mirror
        run: |
          # Single-source structural gate (review phlix-plugins__devops M-01/M-03):
          # scripts/catalog-gate.jq — the SAME filter the catalog updater re-runs on
          # its computed file immediately before every bot push (GITHUB_TOKEN commits
          # do not re-trigger this workflow, so the updater must carry the gate).
          # `jq -e` already fails on a JSON parse error, so this step doubles as the
          # "valid JSON" assertion; the script then halt_errors (exit 1) on an
          # empty/non-array .plugins (vacuous-pass refusal), plugins.schema.json
          # core-shape violations (required fields, name/ref/artifactSha256/repo/
          # version patterns, type enum, dev-never-verified), out-of-canonical-order
          # entries, or duplicate (name, version) pairs. Canonical order matches the
          # update-checksums workflow's sort comparator EXACTLY: name ascending, then
          # dev-channel entries last within a name (the dev entry reuses the plugin
          # name; version literal "dev" vs the semver release entry), then version
          # ascending as a deterministic tie-break — sort_by([.name, (if .version ==
          # "dev" then 1 else 0 end), .version]), same ordering PHP produces with
          # usort keyed (name, dev-flag, version-string). Uniqueness is enforced on
          # (name, version) pairs, not bare names, because the dev channel
          # intentionally duplicates plugin NAMES.
          jq -e -r -f scripts/catalog-gate.jq plugins.json

  pytest:
    name: pytest catalog tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # (M-PHLIX-PLUGINS-09)
    # Runs comprehensive pytest tests against the catalog structure.
    # This job EXECUTES repo Python — never PR-authored Python from forks
    # (review phlix-plugins__seceng M-06): push events and same-repo PRs only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          # Full pinned closure WITH sha256 hashes (review phlix-plugins__seceng
          # M-07): validator tooling must never float — a hostile or broken upstream
          # release executed by the very job that validates trust is the pwn-request
          # class this repo exists to prevent. --require-hashes refuses ANY
          # hash-less/changed artifact. Bumps are deliberate edits to
          # requirements-test.txt, never silent resolution.
          python -m pip install -q --require-hashes -r requirements-test.txt

      - name: Run pytest tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

  pin-drift:
    name: Pin-drift (blocking on push)
    runs-on: ubuntu-26.04
    # (M-PHLIX-PLUGINS-09) generous for ~41 re-hashes but far under the 6h default.
    timeout-minutes: 20
    # Surfaces ref/artifactSha256 drift. BLOCKS pushes (a moved pin whose bytes
    # don't hash to the recorded digest must never pass silently on the trunk —
    # review phlix-plugins__seceng M-05); stays advisory on pull requests so
    # external PRs don't flake on network/CDN hiccups while re-hashing 41+
    # tarballs. Gated behind `needs: schema` (M-06): never fetch URLs minted
    # from an unvalidated catalog.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    needs: schema
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Verify each entry's artifactSha256 matches its pinned tarball
        run: |
          set -u
          # Input guard (review phlix-plugins__devops M-03): the loop below is fed by a
          # process substitution, so a jq crash or an unparseable/empty plugins.json
          # would feed it ZERO lines and the job would 'pass' having validated nothing.
          # Parse+non-empty up front, then prove coverage: checked must equal total.
          total="$(jq -e '.plugins | length' plugins.json 2>/dev/null)" || {
            echo "ERROR: plugins.json is missing or unparseable — pin-drift cannot assert anything" >&2
            exit 1
          }
          if [ "${total}" -lt 1 ]; then
            echo "ERROR: plugins.json has zero entries — refusing vacuous pin-drift pass" >&2
            exit 1
          fi
          drift=0
          checked=0
          # owner/repo are derived from the entry `repo` URL; ref + expected
          # digest come straight from the catalog.
          while IFS=$'\t' read -r name repo ref expected; do
            checked=$((checked + 1))
            owner_repo="${repo#https://github.com/}"
            owner_repo="${owner_repo%/}"
            url="https://github.com/${owner_repo}/archive/${ref}.tar.gz"
            echo "::group::${name}"
            echo "url: ${url}"
            actual="$(curl -fsSL --max-time 120 "${url}" | sha256sum | cut -d' ' -f1)" || {
              echo "WARN: could not download ${url}"
              echo "::endgroup::"
              drift=1
              continue
            }
            if [ "${actual}" = "${expected}" ]; then
              echo "OK: ${actual}"
            else
              echo "DRIFT: expected ${expected} but tarball hashes to ${actual}"
              drift=1
            fi
            echo "::endgroup::"
          done < <(jq -r '.plugins[] | [.name, .repo, .ref, .artifactSha256] | @tsv' plugins.json)

          if [ "${checked}" -ne "${total}" ]; then
            echo "ERROR: pin-drift visited ${checked} of ${total} catalog entries — coverage is not vacuous by luck" >&2
            exit 1
          fi
          if [ "${drift}" -ne 0 ]; then
            echo "Pin drift detected — blocking on push, advisory on PRs. Review the entries above."
            exit 1
          fi
          echo "All ${checked} pins match their tarballs."

  manifest:
    name: Plugin manifest schema (blocking)
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # (M-PHLIX-PLUGINS-09)
    # BLOCKING: every pinned plugin's plugin.json must satisfy the phlix-shared
    # manifest schema — the same contract the server validates at install time
    # (PluginLoader::finalizeInstall). Prevents pinning a plugin that would fail
    # to install (bad `type`, forbidden `settings.*` key like `managed`, etc.).
    # `needs: schema` (review phlix-plugins__seceng M-06): the fetch loop below
    # builds tarball URLs from catalog data — validate the document shape first.
    needs: schema
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '24'
          # No `cache: npm` — there is no lockfile in this repo (known landmine).

      - name: Fetch the phlix-shared manifest schema (pinned)
        run: |
          # Canonical manifest contract, kept in phlix-shared. Draft 2020-12.
          # M-08: this is a BLOCKING gate whose authority is the schema itself —
          # fetching it from a FLOATING ref (master) meant any push to phlix-shared
          # master silently redefined the install contract this job enforces. Pin
          # to a release tag AND assert the fetched bytes hash to the digest
          # committed below; a contract move is then a deliberate, reviewed edit
          # (bump both ref + digest together), never silent drift. The digest is
          # the sha256 of the file AT that tag (verified equal to the old master
          # bytes when this pin landed — zero behavior change at pinning time).
          set -euo pipefail
          PHLIX_SHARED_REF='v0.52.0'
          MANIFEST_SCHEMA_SHA256='3dd7739c19a942564ee7553245695b1a8cdd07969f467dda5d513ed62a1d8430'
          curl -fsSL --retry 3 --max-time 30 \
            "https://raw.githubusercontent.com/detain/phlix-shared/${PHLIX_SHARED_REF}/schemas/manifest.schema.json" \
            -o manifest.schema.json
          actual="$(sha256sum manifest.schema.json | cut -d' ' -f1)"
          if [ "${actual}" != "${MANIFEST_SCHEMA_SHA256}" ]; then
            echo "ERROR: manifest.schema.json at phlix-shared ${PHLIX_SHARED_REF} hashes to ${actual}," >&2
            echo "       not the pinned digest ${MANIFEST_SCHEMA_SHA256}." >&2
            echo "       Either tag contents changed after pinning, or the wrong ref was fetched." >&2
            echo "       Refusing to validate against an unattested schema — bump ref+digest deliberately." >&2
            exit 1
          fi
          echo "manifest schema: phlix-shared ${PHLIX_SHARED_REF} (${actual}) $(jq -r '."$schema"' manifest.schema.json)"

      - name: Validate every pinned plugin's plugin.json against the manifest schema
        run: |
          set -u
          # Input guard (review phlix-plugins__devops M-03): this is the BLOCKING gate
          # that promises 'If any pinned manifest is invalid, CI fails' — but the loop
          # was fed by a process substitution, so a jq crash / unparseable / empty
          # plugins.json yielded ZERO iterations and exit 0 (vacuous pass). Parse and
          # demand a non-empty catalog up front, and after the loop require that every
          # entry was actually visited.
          total="$(jq -e '.plugins | length' plugins.json 2>/dev/null)" || {
            echo "ERROR: plugins.json is missing or unparseable — manifest gate cannot assert anything" >&2
            exit 1
          }
          if [ "${total}" -lt 1 ]; then
            echo "ERROR: plugins.json has zero entries — refusing vacuous manifest pass" >&2
            exit 1
          fi
          fail=0
          checked=0
          while IFS=$'\t' read -r name repo ref; do
            checked=$((checked + 1))
            owner_repo="${repo#https://github.com/}"; owner_repo="${owner_repo%/}"
            url="https://github.com/${owner_repo}/archive/${ref}.tar.gz"
            echo "::group::${name} (${ref})"
            work="$(mktemp -d)"
            if ! curl -fsSL --max-time 120 "${url}" | tar -xz -C "${work}" --strip-components=1; then
              echo "ERROR: could not download/extract ${url}"
              fail=1; rm -rf "${work}"; echo "::endgroup::"; continue
            fi
            if [ ! -f "${work}/plugin.json" ]; then
              echo "ERROR: ${name} has no plugin.json at the repo root"
              fail=1; rm -rf "${work}"; echo "::endgroup::"; continue
            fi
            # ajv-cli 5.0.0 (ajv v8, Draft 2020-12) + ajv-formats 2.1.1 — exact
            # versions (M-07), same pins as the schema job.
            if npx --yes --package ajv-cli@5.0.0 --package ajv-formats@2.1.1 -- \
                 ajv validate --spec=draft2020 --all-errors \
                   -s manifest.schema.json -d "${work}/plugin.json" -c ajv-formats; then
              echo "OK: ${name} manifest is valid"
            else
              echo "INVALID: ${name} manifest fails the manifest schema (see ajv errors above)"
              fail=1
            fi
            rm -rf "${work}"
            echo "::endgroup::"
          done < <(jq -r '.plugins[] | [.name, .repo, .ref] | @tsv' plugins.json)

          if [ "${checked}" -ne "${total}" ]; then
            echo "ERROR: manifest gate validated ${checked} of ${total} catalog entries — refusing a coverage-incomplete pass" >&2
            exit 1
          fi
          if [ "${fail}" -ne 0 ]; then
            echo "One or more pinned plugin manifests are invalid — the server would reject them at install. Refusing to pin."
            exit 1
          fi
          echo "All ${checked} pinned plugin manifests satisfy the manifest schema."
