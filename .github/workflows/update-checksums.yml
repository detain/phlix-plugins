name: Update Checksums

on:
  repository_dispatch:
    types: [plugin-push]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update-checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Verify php available
        run: |
          command -v php || { echo "ERROR: php CLI not available"; exit 1; }
          php -v | head -1

      - name: Get plugins.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verify the file is valid JSON before proceeding
          gh api repos/detain/phlix-plugins/contents/plugins.json --jq '.content' \
            | base64 -d > /tmp/plugins.json
          php -r 'json_decode(file_get_contents("/tmp/plugins.json"), true, 512, JSON_THROW_ON_ERROR); echo "plugins.json is valid JSON" . PHP_EOL;' \
            || { echo "ERROR: plugins.json is not valid JSON"; cat /tmp/plugins.json; exit 1; }

      - name: Compute updated checksums
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php << 'PHPEOF'
          <?php
          declare(strict_types=1);

          // Phlix plugin catalog updater. Phases:
          //   A. Discover candidate plugin repos (GitHub topic search, org:detain)
          //   B. Per-repo fetch: default branch -> head sha -> tarball -> sha256 -> plugin.json
          //   C. Merge into the catalog: update drifted checksums, auto-add new
          //      plugins (manifest-validated), then write the catalog back into the
          //      checkout (GITHUB_WORKSPACE/plugins.json).
          //
          // Robustness contract: one malformed repo must never kill the job — every
          // per-repo failure prints "SKIP <name>: reason" and continues with the next
          // repo. The script exits 1 only for discovery failure, an unparseable
          // catalog, or a JSON encode failure.

          const PLUGIN_NAME_RE = '/^phlix-plugin-[a-z0-9][a-z0-9-]*$/';
          const SAFE_BRANCH_RE = '/^[A-Za-z0-9][A-Za-z0-9._\/-]*$/';
          const SHA40_RE = '/^[0-9a-f]{40}$/';
          const SHA64_RE = '/^[0-9a-f]{64}$/';
          const SEMVER_RE = '/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/';
          const CATALOG_TYPES = [
              'metadata-provider',
              'scrobbler',
              'subtitle-provider',
              'notifier',
              'player',
              'integration',
              'ui-theme',
          ];

          function envOr(string $key, string $default): string
          {
              $value = getenv($key);
              return ($value === false || trim($value) === '') ? $default : trim($value);
          }

          function stateDir(): string
          {
              // PHLIX_STATE_DIR exists only for local simulation; CI keeps /tmp.
              return envOr('PHLIX_STATE_DIR', '/tmp');
          }

          function skipFetch(): bool
          {
              return envOr('PHLIX_SKIP_FETCH', '') !== '';
          }

          function readManifest(string $path): ?array
          {
              if (!is_file($path)) {
                  return null;
              }
              try {
                  $manifest = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
                  return is_array($manifest) ? $manifest : null;
              } catch (JsonException $e) {
                  return null;
              }
          }

          function isGzipFile(string $path): bool
          {
              // Cheap magic-byte check: a real codeload tarball starts with the
              // gzip header (0x1f 0x8b). Error bodies from the GitHub API never do,
              // so this rejects 404/401/rate-limit responses before hashing.
              $fh = fopen($path, 'rb');
              if ($fh === false) {
                  return false;
              }
              $magic = fread($fh, 2);
              fclose($fh);
              return $magic === "\x1f\x8b";
          }

          // ---------------------------------------------------------------------------
          // Phase A: discover candidate repos (topic search scoped to the detain org)
          // ---------------------------------------------------------------------------
          $discoveryJson = getenv('PHLIX_DISCOVERY_JSON');
          if ($discoveryJson === false || trim($discoveryJson) === '') {
              $cmd = 'gh api --paginate "search/repositories?q=topic:phlix-plugin+org:detain&per_page=100" --jq \'[.items[] | select(.archived == false) | .name]\' 2>&1';
              $discoveryJson = trim((string) shell_exec($cmd));
          }
          $repos = json_decode($discoveryJson, true);
          if (!is_array($repos) || count($repos) === 0) {
              fwrite(STDERR, "ERROR: discovery returned no repos (broken search/token? raw output follows)\n" . $discoveryJson . "\n");
              exit(1);
          }
          echo 'Discovered ' . count($repos) . " candidate repo(s)\n";

          // ---------------------------------------------------------------------------
          // Phase B: per-repo fetch -> pinned ref, tarball sha256, plugin manifest
          // ---------------------------------------------------------------------------
          $state = [];
          foreach ($repos as $name) {
              if (!is_string($name) || !preg_match(PLUGIN_NAME_RE, $name)) {
                  echo 'SKIP ' . (is_string($name) ? $name : var_export($name, true)) . ": invalid repo name\n";
                  continue;
              }

              if (skipFetch()) {
                  // Local simulation mode: read pre-made fixture files instead of
                  // shelling out to gh/curl. Fixtures replicate Phase B output:
                  //   <stateDir>/ref_<name>.txt     40-hex head sha
                  //   <stateDir>/sha256_<name>.txt  64-hex tarball digest
                  //   <stateDir>/manifest_<name>.json  optional plugin.json
                  $dir = stateDir();
                  $ref = trim((string) file_get_contents($dir . '/ref_' . $name . '.txt'));
                  $sha256 = trim((string) file_get_contents($dir . '/sha256_' . $name . '.txt'));
                  if (!preg_match(SHA40_RE, $ref) || !preg_match(SHA64_RE, $sha256)) {
                      echo 'SKIP ' . $name . ': no fixture state files in ' . $dir . "\n";
                      continue;
                  }
                  $state[$name] = [
                      'ref' => $ref,
                      'sha256' => $sha256,
                      'manifest' => readManifest($dir . '/manifest_' . $name . '.json'),
                  ];
                  continue;
              }

              // The name gate above runs BEFORE $name is interpolated into any shell
              // command below — the regex permits only [a-z0-9-], so injection is
              // impossible by construction.
              $branch = trim((string) shell_exec('gh api repos/detain/' . $name . ' --jq \'.default_branch\' 2>&1'));
              if ($branch === '') {
                  $branch = 'master';
              }
              // Branch names legally allow ; $ ` & | quotes and parens — a hostile
              // default branch must never reach a shell string. Gate before use.
              if (!preg_match(SAFE_BRANCH_RE, $branch)) {
                  echo 'SKIP ' . $name . ": unsafe branch name '" . $branch . "'\n";
                  continue;
              }

              $sha = trim((string) shell_exec('gh api repos/detain/' . $name . '/commits/' . $branch . ' --jq \'.sha\' 2>&1'));
              if (!preg_match(SHA40_RE, $sha)) {
                  echo 'SKIP ' . $name . ": invalid ref '" . $sha . "'\n";
                  continue;
              }

              $dir = stateDir();
              $tarball = $dir . '/phlix_plugin_' . $name . '.tar.gz';
              // Codeload archive URL — the SAME artifact form the server downloads
              // (github.com/<owner>/<repo>/archive/<ref>.tar.gz, per the schema) and
              // that validate-catalog.yml hashes. The api.github.com tarball endpoint
              // produces DIFFERENT bytes for the same commit, which would corrupt
              // every artifactSha256. -f makes HTTP errors fail instead of saving an
              // error body (the gzip-magic check below remains the backstop).
              shell_exec('curl -fsSL "https://github.com/detain/' . $name . '/archive/' . $sha . '.tar.gz" -o ' . $tarball . ' 2>&1');
              if (!is_file($tarball) || filesize($tarball) <= 0) {
                  echo 'SKIP ' . $name . ": tarball download failed or empty\n";
                  continue;
              }
              if (!isGzipFile($tarball)) {
                  // curl -sL without -f would happily save a JSON error body (404/401/rate-limit)
                  // — never let it reach sha256sum, or an existing entry's pin gets corrupted.
                  echo 'SKIP ' . $name . ": tarball download failed (not a gzip archive)\n";
                  continue;
              }

              $computed = trim((string) shell_exec('sha256sum ' . $tarball . ' | awk \'{print $1}\''));
              if (!preg_match(SHA64_RE, $computed)) {
                  echo 'SKIP ' . $name . ": invalid sha256 '" . $computed . "'\n";
                  continue;
              }

              $extract = $dir . '/phlix_extract_' . $name;
              shell_exec('rm -rf ' . $extract . ' && mkdir -p ' . $extract . ' && tar -xzf ' . $tarball . ' -C ' . $extract . ' --strip-components=1 2>&1');

              $state[$name] = [
                  'ref' => $sha,
                  'sha256' => $computed,
                  'manifest' => readManifest($extract . '/plugin.json'),
              ];
          }

          // Every repo skipped/failed (e.g. gh auth died after discovery) — fail loudly
          // instead of reporting a silent successful no-op merge back to the push step.
          if (count($state) === 0) {
              fwrite(STDERR, "ERROR: all discovered repos were skipped or failed — nothing to merge (auth/network problem?)\n");
              exit(1);
          }

          // ---------------------------------------------------------------------------
          // Phase C: merge fetched state into the catalog (pristine copy read from
          // /tmp/plugins.json as fetched from GitHub in Step 3)
          // ---------------------------------------------------------------------------
          try {
              $plugins = json_decode((string) file_get_contents('/tmp/plugins.json'), true, 512, JSON_THROW_ON_ERROR);
          } catch (JsonException $e) {
              fwrite(STDERR, 'ERROR: plugins.json is not valid JSON: ' . $e->getMessage() . "\n");
              exit(1);
          }
          if (!is_array($plugins) || !isset($plugins['plugins']) || !is_array($plugins['plugins'])) {
              fwrite(STDERR, "ERROR: plugins.json has no 'plugins' array\n");
              exit(1);
          }

          $existing = [];
          foreach ($plugins['plugins'] as $entry) {
              if (is_array($entry) && isset($entry['name']) && is_string($entry['name'])) {
                  $existing[$entry['name']] = true;
              }
          }

          $changed = false;
          $changedPlugins = [];
          $updated = [];

          // UPDATE existing entries whose tarball sha256 drifted from the stored pin.
          // ref and artifactSha256 MUST move in lockstep (the server verifies the
          // tarball of the pinned ref against artifactSha256) — so both are written
          // and both are reported when they drift.
          foreach ($plugins['plugins'] as &$entry) {
              $name = isset($entry['name']) && is_string($entry['name']) ? $entry['name'] : '';
              if ($name === '' || !isset($state[$name]['sha256'])) {
                  continue;
              }
              $stored = isset($entry['artifactSha256']) ? $entry['artifactSha256'] : '';
              $computed = $state[$name]['sha256'];
              if ($computed !== $stored) {
                  $line = 'Plugin ' . $name . ': ' . substr($stored, 0, 16) . '... -> ' . substr($computed, 0, 16) . '...';
                  $entry['artifactSha256'] = $computed;
                  $storedRef = isset($entry['ref']) && is_string($entry['ref']) ? $entry['ref'] : '';
                  if ($storedRef !== $state[$name]['ref']) {
                      $entry['ref'] = $state[$name]['ref'];
                      $line .= ' (ref ' . substr($storedRef, 0, 12) . '... -> ' . substr($state[$name]['ref'], 0, 12) . '...)';
                  }
                  echo $line . "\n";
                  $changed = true;
                  $changedPlugins[] = $name;
                  $updated[] = $name . ': ' . substr($computed, 0, 16);
              }
          }
          unset($entry);

          // ADD discovered repos not yet in the catalog — but only genuine plugins
          // with a valid plugin.json manifest at the pinned ref. Auto-added entries
          // are marked verified=false on purpose: the server install-blocks them in
          // default-deny mode until a human reviews and verifies them.
          foreach ($state as $name => $st) {
              if (isset($existing[$name])) {
                  continue;
              }
              if (!is_array($st['manifest'])) {
                  echo 'SKIP ' . $name . ": not a plugin (no valid plugin.json manifest)\n";
                  continue;
              }
              $manifest = $st['manifest'];

              $manifestName = isset($manifest['name']) && is_string($manifest['name']) ? $manifest['name'] : $name;
              if ($manifestName !== $name) {
                  // Catalog entries must have name and repo agree (the repo URL is
                  // derived from the repo name); a mismatch means a renamed/forked repo.
                  echo 'SKIP ' . $name . ": manifest name '" . $manifestName . "' does not match repo name\n";
                  continue;
              }
              if (!preg_match(PLUGIN_NAME_RE, $manifestName)) {
                  echo 'SKIP ' . $name . ": manifest name '" . $manifestName . "' is not a valid plugin name\n";
                  continue;
              }

              $type = isset($manifest['type']) && is_string($manifest['type']) ? $manifest['type'] : '';
              if (!in_array($type, CATALOG_TYPES, true)) {
                  echo 'SKIP ' . $name . ": manifest type '" . $type . "' not representable in catalog enum\n";
                  continue;
              }

              $version = isset($manifest['version']) && is_string($manifest['version']) ? $manifest['version'] : '';
              if (!preg_match(SEMVER_RE, $version)) {
                  echo 'SKIP ' . $name . ": manifest version '" . $version . "' is not valid semver\n";
                  continue;
              }

              $minServerVersion = isset($manifest['phlix_min_server_version']) && is_string($manifest['phlix_min_server_version'])
                  ? $manifest['phlix_min_server_version']
                  : null;
              if ($minServerVersion !== null && !preg_match(SEMVER_RE, $minServerVersion)) {
                  echo 'SKIP ' . $name . ": manifest phlix_min_server_version '" . $minServerVersion . "' is not valid semver\n";
                  continue;
              }

              $entry = [
                  'name' => $manifestName,
                  'title' => ucwords(str_replace('-', ' ', substr($name, strlen('phlix-plugin-')))),
                  'type' => $type,
                  'repo' => 'https://github.com/detain/' . $name,
                  'ref' => $st['ref'],
                  'artifactSha256' => $st['sha256'],
                  'version' => $version,
              ];
              if ($minServerVersion !== null) {
                  $entry['minServerVersion'] = $minServerVersion;
              }
              $entry['verified'] = false;
              $entry['deprecated'] = false;
              $entry['yanked'] = false;
              $entry['author'] = 'detain';

              $plugins['plugins'][] = $entry;
              $existing[$manifestName] = true;
              $changed = true;
              $changedPlugins[] = $manifestName;
              echo 'ADD ' . $manifestName . '@' . substr($st['ref'], 0, 12) . ' (' . $type . ', v' . $version . ")\n";
          }

          // ---------------------------------------------------------------------------
          // Write back: sort by name (validate-catalog.yml blocks on ordering), then
          // persist into the CHECKOUT working copy — /tmp/plugins.json is only the
          // pristine read source. Writing to the checkout is what makes the Push step
          // able to stage anything (the latent bug this workflow fixes).
          // ---------------------------------------------------------------------------
          $outputFile = getenv('GITHUB_OUTPUT');
          $appendOutput = static function (string $line) use ($outputFile): void {
              if ($outputFile !== false && $outputFile !== '') {
                  file_put_contents($outputFile, $line, FILE_APPEND);
              }
          };

          if ($changed) {
              usort($plugins['plugins'], static function (array $a, array $b): int {
                  $an = isset($a['name']) && is_string($a['name']) ? $a['name'] : '';
                  $bn = isset($b['name']) && is_string($b['name']) ? $b['name'] : '';
                  return strcmp($an, $bn);
              });

              $pluginsPath = envOr('GITHUB_WORKSPACE', '.') . '/plugins.json';
              $json = json_encode($plugins, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE);
              if ($json === false) {
                  fwrite(STDERR, 'ERROR: could not encode catalog JSON: ' . json_last_error_msg() . "\n");
                  exit(1);
              }
              // PHP's JSON_PRETTY_PRINT emits 4-space indent; the catalog is 2-space.
              // Halve every line's leading run so the first write is not a full-file diff.
              $json = preg_replace_callback(
                  '/^( +)/m',
                  static fn (array $m): string => str_repeat(' ', (int) (strlen($m[1]) / 2)),
                  $json
              ) ?? $json;
              // Write the file FIRST, then emit changed=true — the push step must
              // never be told "changed" for a catalog that failed to persist.
              $written = file_put_contents($pluginsPath, $json . "\n");
              if ($written === false) {
                  fwrite(STDERR, 'ERROR: could not write catalog to ' . $pluginsPath . "\n");
                  exit(1);
              }
              echo 'wrote ' . $pluginsPath . "\n";

              echo "changed=true\n";
              echo 'CHANGED_PLUGINS=' . implode(',', $changedPlugins) . "\n";
              echo 'UPDATED=' . implode(',', $updated) . "\n";
              $appendOutput("changed=true\n");
              $appendOutput('CHANGED_PLUGINS=' . implode(',', $changedPlugins) . "\n");
              $appendOutput('UPDATED=' . implode(',', $updated) . "\n");
          } else {
              echo "No checksums changed\n";
              $appendOutput("changed=false\n");
              $appendOutput("CHANGED_PLUGINS=\n");
              $appendOutput("UPDATED=\n");
          }
          PHPEOF

      - name: Push changes
        if: steps.compute.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add plugins.json
          git diff --cached --quiet || git commit -m 'chore(ci): update plugin catalog checksums'
          git diff --cached --stat
          # retry pull-rebase-push so cron runs don't clobber concurrent pushes; fail LOUDLY if it can't land
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            sleep 5
          done
          echo "ERROR: could not push catalog update after 3 attempts" >&2
          exit 1