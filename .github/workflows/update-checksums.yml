name: Update Checksums

on:
  repository_dispatch:
    types: [plugin-push]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  compute-checksums:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - phlix-plugin-anidb
          - phlix-plugin-anilist
          - phlix-plugin-lastfm
          - phlix-plugin-musicbrainz
          - phlix-plugin-myanimelist
          - phlix-plugin-omdb
          - phlix-plugin-opensubtitles
          - phlix-plugin-trakt
    steps:
      - name: Download tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/detain/${{ matrix.plugin }}/contents \
            --jq '.[] | select(.name == "plugins.json") | .download_url' \
            > /tmp/plugins_json_url_${{ matrix.plugin }}.txt 2>&1 || true
          REF=$(gh api repos/detain/${{ matrix.plugin }} --jq '.default_branch')
          curl -sL \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/detain/${{ matrix.plugin }}/tarball/$REF" \
            -o /tmp/plugin_${{ matrix.plugin }}.tar.gz
          echo "tarball_size=$(wc -c < /tmp/plugin_${{ matrix.plugin }}.tar.gz)" >> $GITHUB_OUTPUT
      - name: Compute SHA256
        run: |
          sha256sum /tmp/plugin_${{ matrix.plugin }}.tar.gz | awk '{print $1}' > /tmp/sha256_${{ matrix.plugin }}.txt
          cat /tmp/sha256_${{ matrix.plugin }}.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256_${{ matrix.plugin }}
          path: /tmp/sha256_${{ matrix.plugin }}.txt

  update:
    needs: compute-checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/checksums

      - name: Get plugins.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verify the file is valid JSON before proceeding
          gh api repos/detain/phlix-plugins/contents/plugins.json --jq '.content' \
            | base64 -d > /tmp/plugins.json
          python3 -c "import json; json.load(open('/tmp/plugins.json'))" \
            || { echo "ERROR: plugins.json is not valid JSON"; cat /tmp/plugins.json; exit 1; }
          echo "plugins.json is valid JSON"

      - name: Compute updated checksums
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json
          import os

          # Load plugins.json
          with open('/tmp/plugins.json') as f:
              plugins = json.load(f)

          changed = []
          updated = []

          for entry in plugins.get('plugins', []):
              name = entry.get('name')
              ref = entry.get('ref', '')
              stored_sha = entry.get('artifactSha256', '')

              sha_file = f'/tmp/checksums/sha256_{name}.txt'
              if not os.path.exists(sha_file):
                  continue

              with open(sha_file) as f:
                  computed_sha = f.read().strip()

              if computed_sha != stored_sha:
                  print(f"Plugin {name}: {stored_sha[:16]}... -> {computed_sha[:16]}...")
                  entry['artifactSha256'] = computed_sha
                  changed.append(name)
                  updated.append(f"{name}: {computed_sha[:16]}")

          if changed:
              with open('plugins.json', 'w') as f:
                  json.dump(plugins, f, indent=2, ensure_ascii=False)
              print(f"CHANGED_PLUGINS={','.join(changed)}")
              print("changed=true")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"CHANGED_PLUGINS={','.join(changed)}\n")
                  f.write("changed=true\n")
                  f.write(f"UPDATED={','.join(updated)}\n")
          else:
              print("No checksums changed")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("changed=false\n")
                  f.write("CHANGED_PLUGINS=\n")
                  f.write("UPDATED=\n")
          PYEOF

      - name: Push changes
        if: steps.compute.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add plugins.json
          git diff --cached --stat
          git push
