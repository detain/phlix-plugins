name: Update Checksums

on:
  repository_dispatch:
    types: [plugin-push]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update-checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Verify php available
        run: |
          command -v php || { echo "ERROR: php CLI not available"; exit 1; }
          php -v | head -1

      - name: Get plugins.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verify the file is valid JSON before proceeding
          gh api repos/detain/phlix-plugins/contents/plugins.json --jq '.content' \
            | base64 -d > /tmp/plugins.json
          php -r 'json_decode(file_get_contents("/tmp/plugins.json"), true, 512, JSON_THROW_ON_ERROR); echo "plugins.json is valid JSON" . PHP_EOL;' \
            || { echo "ERROR: plugins.json is not valid JSON"; cat /tmp/plugins.json; exit 1; }

      - name: Compute updated checksums
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php << 'PHPEOF'
          <?php
          declare(strict_types=1);

          // Phlix plugin catalog updater. Phases:
          //   A. Discover candidate plugin repos (GitHub topic search, org:detain)
          //   B. Per-repo fetch: default branch + topics -> head sha -> dev tarball +
          //      manifest; git tags -> latest semver tag -> tagged tarball + manifest
          //   C. Merge into the catalog. Each plugin repo contributes up to TWO entries
          //      that share the plugin name and are distinguished by version:
          //        - release entry: pinned to the latest semver git tag; version is the
          //          semver read from plugin.json at the tag commit (fallback: cleaned
          //          tag name for old tags whose manifests predate the version field)
          //        - dev entry: pinned to default-branch HEAD; version literal "dev"
          //      Tags sync: per-plugin tags = union(repo topics minus the family
          //      denylist, curated tags already in the catalog), applied to both entries.
          //
          // Robustness contract: one malformed repo must never kill the job — every
          // per-repo failure prints "SKIP <name>: reason" and continues with the next
          // repo. The script exits 1 only for: discovery failure, an unparseable
          // catalog, a JSON encode failure, a catalog write failure, or a run where
          // every discovered repo was skipped/failed. Entries are never removed except
          // stale release entries (same name as a plugin with tags, version != "dev" &&
          // != latest tag version); entries of plugins absent from discovery are never
          // touched.

          const PLUGIN_NAME_RE = '/^phlix-plugin-[a-z0-9][a-z0-9-]*$/';
          const SAFE_BRANCH_RE = '/^[A-Za-z0-9][A-Za-z0-9._\/-]*$/';
          const SAFE_TAG_RE = '/^[A-Za-z0-9._\/-]+$/';
          const SHA40_RE = '/^[0-9a-f]{40}$/';
          const SHA64_RE = '/^[0-9a-f]{64}$/';
          const SEMVER_RE = '/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/';
          const DEV_VERSION = 'dev';
          const CATALOG_TYPES = [
              'metadata-provider',
              'scrobbler',
              'subtitle-provider',
              'notifier',
              'player',
              'integration',
              'ui-theme',
          ];

          function envOr(string $key, string $default): string
          {
              $value = getenv($key);
              return ($value === false || trim($value) === '') ? $default : trim($value);
          }

          function stateDir(): string
          {
              // PHLIX_STATE_DIR exists only for local simulation; CI keeps /tmp.
              return envOr('PHLIX_STATE_DIR', '/tmp');
          }

          function skipFetch(): bool
          {
              return envOr('PHLIX_SKIP_FETCH', '') !== '';
          }

          function phaseBOnly(): bool
          {
              // Local verification aid: run Phase B, write state files, exit before
              // merging (lets Phase C be run repeatedly against the same state).
              return envOr('PHLIX_PHASE_B_ONLY', '') !== '';
          }

          function writeStateFile(string $path, string $contents): void
          {
              if (file_put_contents($path, $contents) === false) {
                  fwrite(STDERR, 'ERROR: could not write state file ' . $path . "\n");
                  exit(1);
              }
          }

          function readManifest(string $path): ?array
          {
              if (!is_file($path)) {
                  return null;
              }
              try {
                  $manifest = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
                  return is_array($manifest) ? $manifest : null;
              } catch (JsonException $e) {
                  return null;
              }
          }

          function readTopicsFixture(string $path): array
          {
              if (!is_file($path)) {
                  return [];
              }
              try {
                  $decoded = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
                  return is_array($decoded) ? array_values(array_filter($decoded, 'is_string')) : [];
              } catch (JsonException $e) {
                  return [];
              }
          }

          function isGzipFile(string $path): bool
          {
              // Cheap magic-byte check: a real codeload tarball starts with the
              // gzip header (0x1f 0x8b). Error bodies never do, so this rejects
              // 404/401/rate-limit responses before hashing.
              $fh = fopen($path, 'rb');
              if ($fh === false) {
                  return false;
              }
              $magic = fread($fh, 2);
              fclose($fh);
              return $magic === "\x1f\x8b";
          }

          // ---------------------------------------------------------------------------
          // Semver helpers (pure functions; unit-tested via php -r)
          // ---------------------------------------------------------------------------

          function cleanTagName(string $tagName): string
          {
              // Strip a single leading v/V (v1.2.3 -> 1.2.3); anything else is left as-is.
              return preg_replace('/^[vV]/', '', $tagName) ?? $tagName;
          }

          function semverParts(string $version): ?array
          {
              // [major, minor, patch, prereleaseIdentifiers|null]; build metadata ignored.
              if (!preg_match('/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/', $version, $m)) {
                  return null;
              }
              $prerelease = isset($m[4]) && $m[4] !== '' ? explode('.', $m[4]) : null;
              return [(int) $m[1], (int) $m[2], (int) $m[3], $prerelease];
          }

          function cmpPrereleaseIdentifiers(?array $a, ?array $b): int
          {
              // Semver precedence for prerelease identifier lists; null = release (no
              // prerelease), which has HIGHER precedence than any prerelease.
              if ($a === null && $b === null) return 0;
              if ($a === null) return 1;
              if ($b === null) return -1;
              $count = max(count($a), count($b));
              for ($i = 0; $i < $count; $i++) {
                  $ia = $a[$i] ?? null;
                  $ib = $b[$i] ?? null;
                  if ($ia === null) return -1; // fewer identifiers = lower precedence
                  if ($ib === null) return 1;
                  if (ctype_digit($ia) && ctype_digit($ib)) {
                      $d = (int) $ia <=> (int) $ib;
                  } elseif (ctype_digit($ia)) {
                      $d = -1; // numeric identifiers have lower precedence than alphanumeric
                  } elseif (ctype_digit($ib)) {
                      $d = 1;
                  } else {
                      $d = strcmp($ia, $ib); // ASCII lexical order
                  }
                  if ($d !== 0) return $d;
              }
              return 0;
          }

          function cmpSemverPrecedence(string $a, string $b): int
          {
              $pa = semverParts($a);
              $pb = semverParts($b);
              if ($pa === null || $pb === null) return 0;
              for ($i = 0; $i < 3; $i++) {
                  $d = $pa[$i] <=> $pb[$i];
                  if ($d !== 0) return $d;
              }
              return cmpPrereleaseIdentifiers($pa[3], $pb[3]);
          }

          // Tags TSV output -> [['name','sha','version'], ...] sorted by semver DESC
          // (highest version first; equal versions tie-broken by tag name desc for determinism).
          // Non-semver tags (e.g. "stable") and malformed lines are ignored; every name
          // and sha is gated before it can reach any URL.
          function parseTagsSorted(string $tsvOutput): array
          {
              $tags = [];
              foreach (explode("\n", trim($tsvOutput)) as $line) {
                  if ($line === '') continue;
                  $parts = explode("\t", $line);
                  if (count($parts) !== 2) continue;
                  $tname = trim($parts[0]);
                  $tsha = trim($parts[1]);
                  if (!preg_match(SAFE_TAG_RE, $tname) || !preg_match(SHA40_RE, $tsha)) continue;
                  $tversion = cleanTagName($tname);
                  if (semverParts($tversion) === null) continue;
                  $tags[] = ['name' => $tname, 'sha' => $tsha, 'version' => $tversion];
              }
              usort($tags, static function (array $a, array $b): int {
                  $d = cmpSemverPrecedence($b['version'], $a['version']);
                  return $d !== 0 ? $d : strcmp($b['name'], $a['name']);
              });
              return $tags;
          }

          // ---------------------------------------------------------------------------
          // Phase B target fetch (live mode): codeload archive at $sha — the SAME
          // artifact form the server downloads (github.com/<owner>/<repo>/archive/<ref>.tar.gz,
          // per the schema) and validate-catalog.yml hashes. The api.github.com tarball
          // endpoint produces DIFFERENT bytes for the same commit. -f makes HTTP errors
          // fail instead of saving an error body; the gzip-magic check below remains the
          // backstop. Returns ['sha256' => string, 'manifest' => ?array] or null.
          // ---------------------------------------------------------------------------
          function fetchTargetTarball(string $name, string $sha, string $dir, string $suffix): ?array
          {
              $tarball = $dir . '/phlix_plugin_' . $name . $suffix . '.tar.gz';
              shell_exec('curl -fsSL "https://github.com/detain/' . $name . '/archive/' . $sha . '.tar.gz" -o ' . $tarball . ' 2>&1');
              if (!is_file($tarball) || filesize($tarball) <= 0) {
                  return null;
              }
              if (!isGzipFile($tarball)) {
                  return null;
              }
              $computed = trim((string) shell_exec('sha256sum ' . $tarball . ' | awk \'{print $1}\''));
              if (!preg_match(SHA64_RE, $computed)) {
                  return null;
              }
              $extract = $dir . '/phlix_extract_' . $name . $suffix;
              shell_exec('rm -rf ' . $extract . ' && mkdir -p ' . $extract . ' && tar -xzf ' . $tarball . ' -C ' . $extract . ' --strip-components=1 2>&1');
              return ['sha256' => $computed, 'manifest' => readManifest($extract . '/plugin.json')];
          }

          // ---------------------------------------------------------------------------
          // Phase C helpers
          // ---------------------------------------------------------------------------

          function deriveTitle(string $name): string
          {
              return ucwords(str_replace('-', ' ', substr($name, strlen('phlix-plugin-'))));
          }

          function normalizeTags(array $tags): array
          {
              // Deterministic order for stable diffs: case-insensitive sort, tie-break
              // case-sensitive; dedupe case-insensitively, keeping the first occurrence.
              $unique = [];
              foreach ($tags as $tag) {
                  if (!is_string($tag) || $tag === '') continue;
                  $unique[strtolower($tag)] = $tag;
              }
              $list = array_values($unique);
              usort($list, static function (string $a, string $b): int {
                  $d = strcasecmp($a, $b);
                  return $d !== 0 ? $d : strcmp($a, $b);
              });
              return $list;
          }

          function computeSyncedTags(array $topics, array $curatedTags, array $denylist): array
          {
              $out = [];
              foreach ($topics as $topic) {
                  if (is_string($topic) && !isset($denylist[$topic])) {
                      $out[$topic] = true;
                  }
              }
              foreach (array_keys($curatedTags) as $tag) {
                  $out[$tag] = true;
              }
              return normalizeTags(array_keys($out));
          }

          function carryVerified(array $entriesWithName): bool
          {
              // Prefer the OLD release entry (non-dev) verified flag; fall back to any
              // entry. Auto-added/unknown plugins default to false (default-deny).
              foreach ($entriesWithName as $entry) {
                  if (($entry['version'] ?? '') !== DEV_VERSION && ($entry['verified'] ?? false) === true) return true;
              }
              foreach ($entriesWithName as $entry) {
                  if (($entry['verified'] ?? false) === true) return true;
              }
              return false;
          }

          function carryField(array $entriesWithName, string $field): ?string
          {
              // Curated text fields (summary/description) survive roll-forward the same
              // way curated trust does; manifests carry no such fields, so without the carry
              // a version bump would silently drop the curation.
              foreach ($entriesWithName as $entry) {
                  if (($entry['version'] ?? '') !== DEV_VERSION && isset($entry[$field]) && is_string($entry[$field])) return $entry[$field];
              }
              foreach ($entriesWithName as $entry) {
                  if (isset($entry[$field]) && is_string($entry[$field])) return $entry[$field];
              }
              return null;
          }

          function pickTitle(mixed $ownTitle, array $entriesForName, string $name): string
          {
              // Automation must NEVER overwrite human curation: the target slot's existing
              // non-empty title always wins. Otherwise carry a curated title from a sibling
              // slot with the same name (so a curated release title flows into a plugin's
              // first dev entry, and a human-edited dev title is never re-squashed); only
              // genuinely fresh content derives its title from the repo name.
              if (is_string($ownTitle) && $ownTitle !== '') {
                  return $ownTitle;
              }
              $carried = carryField($entriesForName, 'title');
              return $carried ?? deriveTitle($name);
          }

          // ---------------------------------------------------------------------------
          // Phase A: discover candidate repos (topic search scoped to the detain org)
          // ---------------------------------------------------------------------------
          $discoveryJson = getenv('PHLIX_DISCOVERY_JSON');
          if ($discoveryJson === false || trim($discoveryJson) === '') {
              $cmd = 'gh api --paginate "search/repositories?q=topic:phlix-plugin+org:detain&per_page=100" --jq \'[.items[] | select(.archived == false) | .name]\' 2>&1';
              $discoveryJson = trim((string) shell_exec($cmd));
          }
          $repos = json_decode($discoveryJson, true);
          if (!is_array($repos) || count($repos) === 0) {
              fwrite(STDERR, "ERROR: discovery returned no repos (broken search/token? raw output follows)\n" . $discoveryJson . "\n");
              exit(1);
          }
          echo 'Discovered ' . count($repos) . " candidate repo(s)\n";

          // ---------------------------------------------------------------------------
          // Phase B: per-repo fetch -> dev trio (HEAD) + tagged trio (latest semver tag)
          // + topics; state files written to stateDir() (fixture mode reads the same layout)
          // ---------------------------------------------------------------------------
          $state = [];
          foreach ($repos as $name) {
              if (!is_string($name) || !preg_match(PLUGIN_NAME_RE, $name)) {
                  echo 'SKIP ' . (is_string($name) ? $name : var_export($name, true)) . ": invalid repo name\n";
                  continue;
              }

              if (skipFetch()) {
                  // Local simulation mode: read pre-made fixture files instead of
                  // shelling out to gh/curl. Fixtures replicate Phase B output:
                  //   <stateDir>/ref_<name>.txt            dev: 40-hex HEAD sha
                  //   <stateDir>/sha256_<name>.txt         dev: 64-hex HEAD tarball digest
                  //   <stateDir>/manifest_<name>.json      dev: optional plugin.json
                  //   <stateDir>/tagged_ref_<name>.txt     release: 40-hex tag sha (absent = no tags)
                  //   <stateDir>/tagged_sha256_<name>.txt  release: 64-hex tag tarball digest
                  //   <stateDir>/tagged_manifest_<name>.json release: optional plugin.json at tag commit
                  //   <stateDir>/topics_<name>.json        JSON array of repo topics
                  $dir = stateDir();
                  $refFile = $dir . '/ref_' . $name . '.txt';
                  $shaFile = $dir . '/sha256_' . $name . '.txt';
                  $ref = is_file($refFile) ? trim((string) file_get_contents($refFile)) : '';
                  $sha256 = is_file($shaFile) ? trim((string) file_get_contents($shaFile)) : '';
                  if (!preg_match(SHA40_RE, $ref) || !preg_match(SHA64_RE, $sha256)) {
                      echo 'SKIP ' . $name . ': no fixture state files in ' . $dir . "\n";
                      continue;
                  }
                  $stateEntry = [
                      'ref' => $ref,
                      'sha256' => $sha256,
                      'manifest' => readManifest($dir . '/manifest_' . $name . '.json'),
                      'tagged' => null,
                      'topics' => readTopicsFixture($dir . '/topics_' . $name . '.json'),
                  ];
                  $taggedRefFile = $dir . '/tagged_ref_' . $name . '.txt';
                  $taggedRef = is_file($taggedRefFile) ? trim((string) file_get_contents($taggedRefFile)) : '';
                  if (preg_match(SHA40_RE, $taggedRef)) {
                      $taggedShaFile = $dir . '/tagged_sha256_' . $name . '.txt';
                      $taggedSha256 = is_file($taggedShaFile) ? trim((string) file_get_contents($taggedShaFile)) : '';
                      if (preg_match(SHA64_RE, $taggedSha256)) {
                          $taggedNameFile = $dir . '/tagged_name_' . $name . '.txt';
                          $stateEntry['tagged'] = [
                              'name' => is_file($taggedNameFile) ? trim((string) file_get_contents($taggedNameFile)) : 'unknown-tag',
                              'sha' => $taggedRef,
                              'version' => '0.0.0-fixture', // fallback version; Phase C prefers tagged manifest version
                              'sha256' => $taggedSha256,
                              'manifest' => readManifest($dir . '/tagged_manifest_' . $name . '.json'),
                          ];
                      }
                  }
                  $state[$name] = $stateEntry;
                  continue;
              }

              // repo metadata (default branch + topics) — one gh call, parsed explicitly in
              // PHP (fail fast, never shell-mangle JSON); individual repo meta failures SKIP
              // the repo only (stale entries for it are left untouched).
              $metaJson = trim((string) shell_exec('gh api repos/detain/' . $name . ' --jq \'{default_branch: .default_branch, topics: .topics}\' 2>&1'));
              $meta = json_decode($metaJson, true);
              if (!is_array($meta) || !isset($meta['default_branch']) || !is_string($meta['default_branch'])) {
                  echo 'SKIP ' . $name . ': repo metadata fetch failed: ' . trim($metaJson) . "\n";
                  continue;
              }
              $branch = $meta['default_branch'] === '' ? 'master' : $meta['default_branch'];
              // Branch names legally allow ; $ ` & | quotes and parens — a hostile default
              // branch must never reach a shell string. Gate before use.
              if (!preg_match(SAFE_BRANCH_RE, $branch)) {
                  echo 'SKIP ' . $name . ": unsafe branch name '" . $branch . "'\n";
                  continue;
              }
              $topics = [];
              if (isset($meta['topics']) && is_array($meta['topics'])) {
                  $topics = array_values(array_filter($meta['topics'], 'is_string'));
              }

              $sha = trim((string) shell_exec('gh api repos/detain/' . $name . '/commits/' . $branch . ' --jq \'.sha\' 2>&1'));
              if (!preg_match(SHA40_RE, $sha)) {
                  echo 'SKIP ' . $name . ": invalid ref '" . $sha . "'\n";
                  continue;
              }

              $dir = stateDir();
              $dev = fetchTargetTarball($name, $sha, $dir, '');
              if ($dev === null) {
                  echo 'SKIP ' . $name . ": dev tarball fetch failed at HEAD '" . substr($sha, 0, 12) . "'\n";
                  continue;
              }
              $stateEntry = [
                  'ref' => $sha,
                  'sha256' => $dev['sha256'],
                  'manifest' => $dev['manifest'],
                  'tagged' => null,
                  'topics' => $topics,
              ];

              // tags (optional; a failed tags call degrades to dev-only — never fatal).
              // --paginate: a repo crossing the 30-tag page limit must not have its
              // "latest" tag computed from page 1 alone (that could pin a stale tag and
              // stale-REMOVE the correct release entry).
              $tagsJson = trim((string) shell_exec('gh api --paginate repos/detain/' . $name . '/tags --jq \'.[] | [.name, .commit.sha] | @tsv\' 2>&1'));
              $tags = parseTagsSorted($tagsJson);
              if (count($tags) === 0 && $tagsJson !== '') {
                  // Non-empty response but nothing usable (e.g. a 403 rate-limit JSON body
                  // captured via 2>&1) — degrade to "no tags" loudly, never silently.
                  echo 'WARN ' . $name . ": tags response present but unparseable/zero-usable — treating as no tags\n";
              }
              if (count($tags) > 0) {
                  $latest = $tags[0];
                  $release = fetchTargetTarball($name, $latest['sha'], $dir, '_tagged');
                  if ($release === null) {
                      echo 'SKIP ' . $name . ": release tarball fetch failed at tag '" . $latest['name'] . "' — keeping dev entry only\n";
                  } else {
                      $stateEntry['tagged'] = [
                          'name' => $latest['name'],
                          'sha' => $latest['sha'],
                          'version' => $latest['version'],
                          'sha256' => $release['sha256'],
                          'manifest' => $release['manifest'],
                      ];
                  }
              }

              // write state files (same layout fixture mode reads; sim and live share Phase C)
              writeStateFile($dir . '/ref_' . $name . '.txt', $sha . "\n");
              writeStateFile($dir . '/sha256_' . $name . '.txt', $dev['sha256'] . "\n");
              writeStateFile($dir . '/manifest_' . $name . '.json', $dev['manifest'] !== null ? json_encode($dev['manifest'], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n" : '');
              writeStateFile($dir . '/topics_' . $name . '.json', json_encode($topics) . "\n");
              if ($stateEntry['tagged'] !== null) {
                  $tagged = $stateEntry['tagged'];
                  writeStateFile($dir . '/tagged_name_' . $name . '.txt', $tagged['name'] . "\n");
                  writeStateFile($dir . '/tagged_ref_' . $name . '.txt', $tagged['sha'] . "\n");
                  writeStateFile($dir . '/tagged_sha256_' . $name . '.txt', $tagged['sha256'] . "\n");
                  writeStateFile($dir . '/tagged_manifest_' . $name . '.json', $tagged['manifest'] !== null ? json_encode($tagged['manifest'], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n" : '');
              }
              $state[$name] = $stateEntry;
          }

          if (count($state) === 0) {
              fwrite(STDERR, "ERROR: all discovered repos were skipped or failed — nothing to merge (auth/network problem?)\n");
              exit(1);
          }

          if (phaseBOnly()) {
              echo 'PHASE B COMPLETE: state written for ' . count($state) . ' repo(s) to ' . stateDir() . "\n";
              exit(0);
          }

          // ---------------------------------------------------------------------------
          // Phase C: merge fetched state into the catalog (pristine copy read from
          // /tmp/plugins.json as fetched from GitHub in Step 3)
          // ---------------------------------------------------------------------------
          try {
              $plugins = json_decode((string) file_get_contents('/tmp/plugins.json'), true, 512, JSON_THROW_ON_ERROR);
          } catch (JsonException $e) {
              fwrite(STDERR, 'ERROR: plugins.json is not valid JSON: ' . $e->getMessage() . "\n");
              exit(1);
          }
          if (!is_array($plugins) || !isset($plugins['plugins']) || !is_array($plugins['plugins'])) {
              fwrite(STDERR, "ERROR: plugins.json has no 'plugins' array\n");
              exit(1);
          }

          // Stable index: entries are mutated in place or appended; the list is rebuilt
          // only at the very end (removals), so indexes stay valid for the whole merge.
          $byKey = [];
          foreach ($plugins['plugins'] as $i => $entry) {
              if (is_array($entry) && isset($entry['name'], $entry['version']) && is_string($entry['name']) && is_string($entry['version'])) {
                  $byKey[$entry['name'] . "\x00" . $entry['version']] = $i;
              }
          }

          // Family topic denylist: a topic shared by strictly more than half of the
          // repos is a family convention (media-server, self-hosted, php, ...), not a
          // per-plugin descriptor; it is filtered out of the per-plugin tags. Exactly
          // 50% is NOT denylisted.
          $topicCounts = [];
          foreach ($state as $st) {
              foreach (($st['topics'] ?? []) as $topic) {
                  $topicCounts[$topic] = ($topicCounts[$topic] ?? 0) + 1;
              }
          }
          $repoCount = count($state);
          $denylist = [];
          foreach ($topicCounts as $topic => $count) {
              if ($count * 2 > $repoCount) {
                  $denylist[$topic] = true;
              }
          }
          if (count($denylist) > 0) {
              echo 'denylist (' . count($denylist) . ' family topics across ' . $repoCount . ' repos, ' . count($topicCounts) . " distinct): " . implode(', ', array_keys($denylist)) . "\n";
          }

          $removeIndexes = [];
          $changed = false;
          $changedPlugins = [];
          $updated = [];

          foreach ($state as $name => $st) {
              $manifest = $st['manifest'];
              if (!is_array($manifest)) {
                  echo 'SKIP ' . $name . ": not a plugin (no valid plugin.json manifest)\n";
                  continue;
              }
              $manifestName = isset($manifest['name']) && is_string($manifest['name']) ? $manifest['name'] : $name;
              if ($manifestName !== $name) {
                  echo 'SKIP ' . $name . ": manifest name '" . $manifestName . "' does not match repo name\n";
                  continue;
              }
              if (!preg_match(PLUGIN_NAME_RE, $manifestName)) {
                  echo 'SKIP ' . $name . ": manifest name '" . $manifestName . "' is not a valid plugin name\n";
                  continue;
              }
              $type = isset($manifest['type']) && is_string($manifest['type']) ? $manifest['type'] : '';
              if (!in_array($type, CATALOG_TYPES, true)) {
                  echo 'SKIP ' . $name . ": manifest type '" . $type . "' not representable in catalog enum\n";
                  continue;
              }

              $devMinServer = (isset($manifest['phlix_min_server_version']) && is_string($manifest['phlix_min_server_version']) && preg_match(SEMVER_RE, $manifest['phlix_min_server_version']))
                  ? $manifest['phlix_min_server_version']
                  : null;
              if ($devMinServer === null) {
                  echo 'SKIP ' . $name . ": HEAD plugin.json has no valid phlix_min_server_version — not a contract-valid plugin (existing entries stay pinned to their last valid ref)\n";
                  continue;
              }

              // Snapshot of this plugin's catalog entries BEFORE any write this run — the
              // title-carry source for new or empty slots (see pickTitle).
              $entriesForName = [];
              foreach ($plugins['plugins'] as $entry) {
                  if (($entry['name'] ?? '') === $name) $entriesForName[] = $entry;
              }

              // synced tags: repo topics minus the family denylist, union the curated
              // tags already present on any of this plugin's catalog entries.
              $curatedTags = [];
              foreach ($plugins['plugins'] as $entry) {
                  if (($entry['name'] ?? '') === $name && isset($entry['tags']) && is_array($entry['tags'])) {
                      foreach ($entry['tags'] as $tag) {
                          if (is_string($tag) && $tag !== '') $curatedTags[$tag] = true;
                      }
                  }
              }
              $syncedTags = computeSyncedTags($st['topics'] ?? [], $curatedTags, $denylist);

              $tagsChanged = false;
              $oldTagsCount = 0;
              foreach ($plugins['plugins'] as $i => $entry) {
                  if (($entry['name'] ?? '') !== $name) continue;
                  $oldTags = isset($entry['tags']) && is_array($entry['tags']) ? $entry['tags'] : [];
                  if ($oldTagsCount === 0) $oldTagsCount = count(normalizeTags($oldTags));
                  if (normalizeTags($oldTags) !== $syncedTags) {
                      $tagsChanged = true;
                      // Apply synced tags to EVERY existing entry of this plugin (a plugin
                      // without tags has no release write-path this run, yet its entries must
                      // still converge — otherwise the log would churn without a write and
                      // run #2 would never reach "No checksums changed").
                      $plugins['plugins'][$i]['tags'] = $syncedTags;
                  }
              }
              if ($tagsChanged) {
                  echo 'tags ' . $name . ': ' . $oldTagsCount . ' -> ' . count($syncedTags) . " (topics sync)\n";
                  $changed = true;
                  $changedPlugins[] = $name;
              }

              // ---- RELEASE entry (only when the repo has git tags this run) ----
              if ($st['tagged'] !== null) {
                  $tagged = $st['tagged'];
                  // Install-contract gate on the TAGGED manifest: validate-catalog.yml's
                  // blocking job validates every pinned plugin.json against the phlix-shared
                  // manifest schema, so a tag whose manifest predates that contract (missing
                  // phlix_min_server_version, a mistyped manifest name, no plugin.json at all)
                  // must never be pinned as a release entry — the repo degrades to dev-only.
                  $tagManifest = $tagged['manifest'];
                  $tagManifestName = (is_array($tagManifest) && isset($tagManifest['name']) && is_string($tagManifest['name'])) ? $tagManifest['name'] : '';
                  $tagMinServer = (is_array($tagManifest) && isset($tagManifest['phlix_min_server_version']) && is_string($tagManifest['phlix_min_server_version']) && preg_match(SEMVER_RE, $tagManifest['phlix_min_server_version']))
                      ? $tagManifest['phlix_min_server_version']
                      : null;
                  $releaseSkipReason = null;
                  if (!is_array($tagManifest)) {
                      $releaseSkipReason = "no valid plugin.json at tag '" . $tagged['name'] . "'";
                  } elseif ($tagManifestName !== $name || !preg_match(PLUGIN_NAME_RE, $tagManifestName)) {
                      $releaseSkipReason = "tag '" . $tagged['name'] . "' manifest name '" . $tagManifestName . "' does not match the repo name/pattern";
                  } elseif ($tagMinServer === null) {
                      $releaseSkipReason = "tag '" . $tagged['name'] . "' manifest has no valid phlix_min_server_version";
                  } else {
                      $tagVersion = null;
                      if (isset($tagManifest['version']) && is_string($tagManifest['version']) && preg_match(SEMVER_RE, $tagManifest['version'])) {
                          $tagVersion = $tagManifest['version']; // manifest version at the tag commit is authoritative
                      } elseif (preg_match(SEMVER_RE, $tagged['version'])) {
                          $tagVersion = $tagged['version']; // graceful fallback: cleaned tag name (old tags predate the version field)
                      }
                      if ($tagVersion === null) {
                          $releaseSkipReason = "tag '" . $tagged['name'] . "' has no semver version (manifest version missing/invalid; cleaned tag name not semver)";
                      }
                  }
                  if ($releaseSkipReason !== null) {
                      echo 'SKIP ' . $name . ': release entry skipped — ' . $releaseSkipReason . " (keeping dev entry only)\n";
                  } else {
                      $releaseType = (isset($tagManifest['type']) && is_string($tagManifest['type']) && in_array($tagManifest['type'], CATALOG_TYPES, true))
                          ? $tagManifest['type']
                          : $type;
                      $releaseKey = $name . "\x00" . $tagVersion;
                      $existingIndex = $byKey[$releaseKey] ?? null;
                      $oldVersion = null;

                      if ($existingIndex !== null && is_array($plugins['plugins'][$existingIndex])) {
                          // In-place upsert: (name, version) already in the catalog —
                          // refresh the pin and metadata; verified/summary/description
                          // (curated fields) stay untouched. Log/change ONLY if the entry
                          // actually differs (idempotency: a second run must be a no-op).
                          $oldEntry = $plugins['plugins'][$existingIndex];
                          $entry = $oldEntry;
                          $entry['ref'] = $tagged['sha'];
                          $entry['artifactSha256'] = $tagged['sha256'];
                          $entry['type'] = $releaseType;
                          $entry['title'] = pickTitle($entry['title'] ?? null, $entriesForName, $name);
                          $entry['repo'] = 'https://github.com/detain/' . $name;
                          $entry['minServerVersion'] = $tagMinServer;
                          $entry['tags'] = $syncedTags;
                          if ($entry !== $oldEntry) {
                              $oldSha = isset($oldEntry['artifactSha256']) && is_string($oldEntry['artifactSha256']) ? $oldEntry['artifactSha256'] : '';
                              $oldRef = isset($oldEntry['ref']) && is_string($oldEntry['ref']) ? $oldEntry['ref'] : '';
                              $line = 'Plugin ' . $name . ': ' . substr($oldSha, 0, 16) . '... -> ' . substr($tagged['sha256'], 0, 16) . '...';
                              if ($oldRef !== $tagged['sha']) {
                                  $line .= ' (ref ' . substr($oldRef, 0, 12) . '... -> ' . substr($tagged['sha'], 0, 12) . '...)';
                              }
                              echo $line . "\n";
                              $plugins['plugins'][$existingIndex] = $entry;
                              $changed = true;
                              $changedPlugins[] = $name;
                              $updated[] = $name . ': ' . substr($tagged['sha256'], 0, 16);
                          }
                      } else {
                          // New release entry (first tag, or roll-forward to a newer tag).
                          // The OLD release entry (different version) is removed below;
                          // curated trust and curated text carry over so a version bump
                          // never resets verification.
                          $oldEntries = [];
                          foreach ($plugins['plugins'] as $entry) {
                              if (($entry['name'] ?? '') === $name) $oldEntries[] = $entry;
                          }
                          foreach ($oldEntries as $oldEntry) {
                              if (($oldEntry['version'] ?? '') !== DEV_VERSION) { $oldVersion = $oldEntry['version']; break; }
                          }
                          $carriedVerified = carryVerified($oldEntries);
                          $entry = [
                              'name' => $name,
                              'title' => pickTitle(null, $entriesForName, $name),
                              'type' => $releaseType,
                              'repo' => 'https://github.com/detain/' . $name,
                              'ref' => $tagged['sha'],
                              'artifactSha256' => $tagged['sha256'],
                              'version' => $tagVersion,
                          ];
                          $entry['minServerVersion'] = $tagMinServer; // guaranteed by the install-contract gate
                          $entry['verified'] = $carriedVerified;
                          $entry['deprecated'] = false;
                          $entry['yanked'] = false;
                          $entry['author'] = 'detain';
                          $entry['tags'] = $syncedTags;
                          $carriedSummary = carryField($oldEntries, 'summary');
                          $carriedDescription = carryField($oldEntries, 'description');
                          if ($carriedSummary !== null) $entry['summary'] = $carriedSummary;
                          if ($carriedDescription !== null) $entry['description'] = $carriedDescription;

                          $plugins['plugins'][] = $entry;
                          $byKey[$releaseKey] = count($plugins['plugins']) - 1;
                          if ($oldVersion !== null && $oldVersion !== $tagVersion) {
                              echo 'Plugin ' . $name . ': release version ' . $oldVersion . ' -> ' . $tagVersion . " (tag '" . $tagged['name'] . "', verified carry=" . ($carriedVerified ? 'true' : 'false') . ")\n";
                              $updated[] = $name . ': ' . $oldVersion . ' -> ' . $tagVersion;
                          } else {
                              echo 'ADD ' . $name . '@' . substr($tagged['sha'], 0, 12) . ' (' . $releaseType . ', v' . $tagVersion . ")\n";
                          }
                          $changed = true;
                          $changedPlugins[] = $name;
                      }

                      // Stale release cleanup (only with tags data and a known latest tag
                      // version): drop entries with this name whose version is neither the
                      // dev literal nor the latest tag version — roll-forward keeps exactly
                      // one release entry per plugin.
                      foreach ($plugins['plugins'] as $i => $entry) {
                          if (($entry['name'] ?? '') !== $name) continue;
                          $v = isset($entry['version']) ? $entry['version'] : '';
                          if ($v !== DEV_VERSION && $v !== $tagVersion) {
                              $removeIndexes[$i] = true;
                              echo 'REMOVE ' . $name . '@' . $v . ' (stale release; latest tag version ' . $tagVersion . ")\n";
                          }
                      }
                  }
              }

              // ---- DEV entry (always; pinned to HEAD, version literal "dev",
              // verified=false ALWAYS — the dev channel is unstable by design) ----
              $devKey = $name . "\x00" . DEV_VERSION;
              $existingDevIndex = $byKey[$devKey] ?? null;
              if ($existingDevIndex !== null && is_array($plugins['plugins'][$existingDevIndex])) {
                  $oldDevEntry = $plugins['plugins'][$existingDevIndex];
                  $entry = $oldDevEntry;
                  $entry['ref'] = $st['ref'];
                  $entry['artifactSha256'] = $st['sha256'];
                  $entry['version'] = DEV_VERSION;
                  $entry['type'] = $type;
                  $entry['title'] = pickTitle($entry['title'] ?? null, $entriesForName, $name);
                  $entry['repo'] = 'https://github.com/detain/' . $name;
                  $entry['minServerVersion'] = $devMinServer; // guaranteed by the contract gate
                  $entry['verified'] = false;
                  $entry['deprecated'] = false;
                  $entry['yanked'] = false;
                  $entry['author'] = 'detain';
                  $entry['tags'] = $syncedTags;
                  if ($entry !== $oldDevEntry) {
                      $oldDevSha = isset($oldDevEntry['artifactSha256']) && is_string($oldDevEntry['artifactSha256']) ? $oldDevEntry['artifactSha256'] : '';
                      $oldDevRef = isset($oldDevEntry['ref']) && is_string($oldDevEntry['ref']) ? $oldDevEntry['ref'] : '';
                      $line = 'Plugin ' . $name . ' dev: ' . substr($oldDevSha, 0, 16) . '... -> ' . substr($st['sha256'], 0, 16) . '...';
                      if ($oldDevRef !== $st['ref']) {
                          $line .= ' (ref ' . substr($oldDevRef, 0, 12) . '... -> ' . substr($st['ref'], 0, 12) . '...)';
                      }
                      echo $line . "\n";
                      $plugins['plugins'][$existingDevIndex] = $entry;
                      $changed = true;
                      $changedPlugins[] = $name;
                      $updated[] = $name . ': ' . substr($st['sha256'], 0, 16);
                  }
              } else {
                  $entry = [
                      'name' => $name,
                      'title' => pickTitle(null, $entriesForName, $name),
                      'type' => $type,
                      'repo' => 'https://github.com/detain/' . $name,
                      'ref' => $st['ref'],
                      'artifactSha256' => $st['sha256'],
                      'version' => DEV_VERSION,
                  ];
                  $entry['minServerVersion'] = $devMinServer; // guaranteed by the contract gate
                  $entry['verified'] = false;
                  $entry['deprecated'] = false;
                  $entry['yanked'] = false;
                  $entry['author'] = 'detain';
                  $entry['tags'] = $syncedTags;
                  $plugins['plugins'][] = $entry;
                  $byKey[$devKey] = count($plugins['plugins']) - 1;
                  echo 'ADD ' . $name . '@' . substr($st['ref'], 0, 12) . ' (dev-channel ' . $type . ")\n";
                  $changed = true;
                  $changedPlugins[] = $name;
                  $updated[] = $name . ': ' . substr($st['sha256'], 0, 16);
              }
          }

          // ---------------------------------------------------------------------------
          // Write back: apply removals, sort canonically (name asc, dev last within name,
          // version tie-break — matching validate-catalog.yml's jq gate EXACTLY), then
          // persist into the CHECKOUT working copy — /tmp/plugins.json is only the pristine
          // read source. Write the file FIRST, then emit changed=true (the push step must
          // never be told "changed" for a catalog that failed to persist).
          // ---------------------------------------------------------------------------
          if (count($removeIndexes) > 0) {
              $kept = [];
              foreach ($plugins['plugins'] as $i => $entry) {
                  if (!isset($removeIndexes[$i])) $kept[] = $entry;
              }
              $plugins['plugins'] = $kept;
          }

          usort($plugins['plugins'], static function (array $a, array $b): int {
              $an = isset($a['name']) && is_string($a['name']) ? $a['name'] : '';
              $bn = isset($b['name']) && is_string($b['name']) ? $b['name'] : '';
              $cmp = strcmp($an, $bn);
              if ($cmp !== 0) return $cmp;
              $ad = (isset($a['version']) && $a['version'] === DEV_VERSION) ? 1 : 0;
              $bd = (isset($b['version']) && $b['version'] === DEV_VERSION) ? 1 : 0;
              if ($ad !== $bd) return $ad <=> $bd;
              return strcmp(isset($a['version']) ? $a['version'] : '', isset($b['version']) ? $b['version'] : '');
          });

          $outputFile = getenv('GITHUB_OUTPUT');
          $appendOutput = static function (string $line) use ($outputFile): void {
              if ($outputFile !== false && $outputFile !== '') {
                  file_put_contents($outputFile, $line, FILE_APPEND);
              }
          };

          if ($changed) {
              $pluginsPath = envOr('GITHUB_WORKSPACE', '.') . '/plugins.json';
              $json = json_encode($plugins, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE);
              if ($json === false) {
                  fwrite(STDERR, 'ERROR: could not encode catalog JSON: ' . json_last_error_msg() . "\n");
                  exit(1);
              }
              // PHP's JSON_PRETTY_PRINT emits 4-space indent; the catalog is 2-space. Halve
              // every line's leading run so the first write is not a full-file diff.
              $json = preg_replace_callback(
                  '/^( +)/m',
                  static fn (array $m): string => str_repeat(' ', (int) (strlen($m[1]) / 2)),
                  $json
              ) ?? $json;
              $written = file_put_contents($pluginsPath, $json . "\n");
              if ($written === false) {
                  fwrite(STDERR, 'ERROR: could not write catalog to ' . $pluginsPath . "\n");
                  exit(1);
              }
              echo 'wrote ' . $pluginsPath . "\n";

              $changedPlugins = array_values(array_unique($changedPlugins));
              echo "changed=true\n";
              echo 'CHANGED_PLUGINS=' . implode(',', $changedPlugins) . "\n";
              echo 'UPDATED=' . implode(',', $updated) . "\n";
              $appendOutput("changed=true\n");
              $appendOutput('CHANGED_PLUGINS=' . implode(',', $changedPlugins) . "\n");
              $appendOutput('UPDATED=' . implode(',', $updated) . "\n");
          } else {
              echo "No checksums changed\n";
              $appendOutput("changed=false\n");
              $appendOutput("CHANGED_PLUGINS=\n");
              $appendOutput("UPDATED=\n");
          }
          PHPEOF

      - name: Push changes
        if: steps.compute.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add plugins.json
          git diff --cached --quiet || git commit -m 'chore(ci): update plugin catalog checksums'
          git diff --cached --stat
          # retry pull-rebase-push so cron runs don't clobber concurrent pushes; fail LOUDLY if it can't land
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            sleep 5
          done
          echo "ERROR: could not push catalog update after 3 attempts" >&2
          exit 1